<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gelombang atmosfer di 45 kota</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eaf2fa;--surface:#fff;--ink:#12263a;--mute:#5d7388;--line:#dbe6f0;--a:#0a63b8;--b:#c0600b;--fc:rgba(10,99,184,.08);--on:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a141d;--surface:#12212e;--ink:#e6eef5;--mute:#8fa5b7;--line:#243a4b;--a:#4aa8e8;--b:#f0a35a;--fc:rgba(74,168,232,.12);--on:#0a141d}}
:root[data-theme="dark"]{--bg:#0a141d;--surface:#12212e;--ink:#e6eef5;--mute:#8fa5b7;--line:#243a4b;--a:#4aa8e8;--b:#f0a35a;--fc:rgba(74,168,232,.12);--on:#0a141d}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--mute);max-width:62ch}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;margin-bottom:14px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--mute)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:170px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
button{font:inherit;color:var(--ink);cursor:pointer}
.seg button{border:0;background:none;padding:8px 14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;display:grid;text-align:left;line-height:1.25}
.chip small{color:var(--mute);font-size:.78rem}
.chip b{font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 14px 8px}
.read{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;min-height:30px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.read .st{font-size:.8rem;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
.read .st.f{border-style:dashed}
svg{display:block;width:100%;touch-action:pan-y;cursor:crosshair}
svg text{font:12px "Plus Jakarta Sans",system-ui,sans-serif;fill:var(--mute)}
.note{color:var(--mute);font-size:.85rem;margin:14px 0 0;max-width:72ch}
@media(max-width:520px){select{min-width:140px}.sub{font-size:.95rem}}
</style></head><body><main>
<h1>Gelombang atmosfer di 45 kota</h1>
<p class="sub">OLR dan uap air (PWAT) beserta komponen gelombang tropisnya, 1 Januari 2024 sampai 31 Desember 2026 (PWAT sampai 3 Desember 2026). Arahkan kursor ke grafik untuk membaca nilai tiap hari.</p>
<div class="bar">
<label for="ka"><span><i class="dot" style="background:var(--a)"></i>Kota</span><select id="ka"></select></label>
<label for="kb"><span><i class="dot" style="background:var(--b)"></i>Bandingkan dengan</span><select id="kb"></select></label>
<div class="seg" id="dsg" role="group" aria-label="Data"><button data-d="olr" aria-pressed="true">OLR</button><button data-d="pwat" aria-pressed="false">Uap air (PWAT)</button></div>
<div class="seg" id="rg" role="group" aria-label="Rentang waktu"><button data-r="90" aria-pressed="true">90 hari</button><button data-r="365" aria-pressed="false">1 tahun</button><button data-r="0" aria-pressed="false">Semua</button></div>
</div>
<div class="chips" id="chips" role="group" aria-label="Komponen"></div>
<div class="panel"><div class="read" id="read" aria-live="off"></div><svg id="svg" tabindex="0" role="img" aria-label="Grafik harian. Gunakan panah kiri dan kanan untuk menggeser tanggal."></svg></div>
<p class="note" id="note"></p>
</main>
<script>
function init(DS){
const U={olr:'W m⁻²',pwat:'kg m⁻²'};
let D,T,N,OBS;
function useDS(k){D=DS[k];T=D.tanggal;N=T.length;OBS=T.indexOf(D.pengamatan_terakhir)}
useDS('olr');
const V={olr:'OLR (anomali)',low:'LOW',mjo:'MJO',er:'Rossby ekuator (ER)',kelvin:'Kelvin',mrgtd:'MRG/TD'};
const S={d:'olr',a:'Jakarta',b:'',v:'olr',r:90,i:OBS};
const $=s=>document.querySelector(s),svg=$('#svg');
const fmt=n=>n.toFixed(S.d==='pwat'?2:1).replace('-','−').replace('.',',');
const dfmt=(i,o)=>new Date(T[i]+'T00:00:00Z').toLocaleDateString('id-ID',{timeZone:'UTC',...o});
const names=Object.keys(D.kota);
$('#ka').innerHTML=names.map(n=>`<option>${n}</option>`).join('');
$('#kb').innerHTML='<option value="">Tanpa pembanding</option>'+names.map(n=>`<option>${n}</option>`).join('');
$('#ka').value=S.a;
function chips(){$('#chips').innerHTML=D.variabel.map(k=>`<button class="chip" data-v="${k}"><small>${V[k]}</small><b></b></button>`).join('')}
chips();
let G={};
function nice(r){const p=Math.pow(10,Math.floor(Math.log10(r/5))),m=r/5/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p}
function draw(){
  const W=svg.clientWidth||600,H=W<560?320:400,ml=44,mr=12,mt=12,mb=50;
  const i0=S.r?Math.max(0,OBS-S.r):0,i1=S.r?Math.min(N-1,OBS+60):N-1;
  const ser=[[S.a,'var(--a)',''],...(S.b?[[S.b,'var(--b)','6 4']]:[])];
  let lo=0,hi=0;
  ser.forEach(([c])=>{const a=D.kota[c][S.v];for(let i=i0;i<=i1;i++){if(a[i]<lo)lo=a[i];if(a[i]>hi)hi=a[i]}});
  const st=nice(hi-lo||1);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const X=i=>ml+(i-i0)/(i1-i0)*(W-ml-mr),Y=v=>mt+(hi-v)/(hi-lo)*(H-mt-mb);
  G={i0,i1,W,H,ml,mr,mt,mb,X,Y,ser};
  let s='';
  for(let v=lo;v<=hi+1e-9;v+=st)s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${Math.abs(v)<1e-9?'':'stroke-dasharray="2 4"'}/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end">${String(+v.toFixed(2)).replace('-','−').replace('.',',')}</text>`;
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mute)" stroke-width="1.2"/>`;
  s+=`<rect x="${X(OBS)}" y="${mt}" width="${W-mr-X(OBS)}" height="${H-mt-mb}" fill="var(--fc)"/><line x1="${X(OBS)}" x2="${X(OBS)}" y1="${mt}" y2="${H-mb}" stroke="var(--mute)" stroke-dasharray="4 3"/>`;
  const yb=H-mb+30,cf=Math.min((X(OBS)+W-mr)/2,W-36);
  s+=`<line x1="${X(i0)}" x2="${X(OBS)-2}" y1="${yb}" y2="${yb}" stroke="var(--mute)" stroke-width="2"/><line x1="${X(OBS)+2}" x2="${W-mr}" y1="${yb}" y2="${yb}" stroke="var(--a)" stroke-width="2" stroke-dasharray="4 3"/><text x="${(X(i0)+X(OBS))/2}" y="${yb+14}" text-anchor="middle">Pengamatan</text><text x="${cf}" y="${yb+14}" text-anchor="middle">Prakiraan</text>`;
  const mons=[];for(let i=i0;i<=i1;i++)if(T[i].endsWith('-01')||i===i0)mons.push(i);
  const k=Math.ceil(mons.length/(W<560?4:8));
  mons.forEach((i,j)=>{if(j%k===0&&X(i)>ml+8){s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${H-mb}" y2="${H-mb+4}" stroke="var(--mute)"/><text x="${X(i)}" y="${H-mb+17}" text-anchor="middle">${dfmt(i,S.r===90?{day:'numeric',month:'short'}:{month:'short',year:'2-digit'})}</text>`}});
  ser.forEach(([c,col,da])=>{const a=D.kota[c][S.v];let p='';for(let i=i0;i<=i1;i++)p+=(i===i0?'M':'L')+X(i).toFixed(1)+','+Y(a[i]).toFixed(1);
    s+=`<path d="${p}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" ${da?`stroke-dasharray="${da}"`:''}/>`});
  s+=`<g id="cx"><line id="cl" y1="${mt}" y2="${H-mb}" stroke="var(--ink)" stroke-width="1"/>${ser.map((x,j)=>`<circle id="cd${j}" r="4.5" fill="${x[1]}" stroke="var(--surface)" stroke-width="2"/>`).join('')}</g>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('height',H);svg.innerHTML=s;cur();
}
function cur(){
  const{X,Y,ser,i0,i1}=G;S.i=Math.min(i1,Math.max(i0,S.i));const i=S.i,x=X(i);
  $('#cl').setAttribute('x1',x);$('#cl').setAttribute('x2',x);
  ser.forEach(([c],j)=>{const e=$('#cd'+j);e.setAttribute('cx',x);e.setAttribute('cy',Y(D.kota[c][S.v][i]))});
  $('#read').innerHTML=`<strong>${dfmt(i,{day:'numeric',month:'long',year:'numeric'})}</strong><span class="st ${i>OBS?'f':''}">${i>OBS?'Prakiraan':'Pengamatan'}</span>`+
    ser.map(([c,col])=>`<span><i class="dot" style="background:${col}"></i>${c} <strong>${fmt(D.kota[c][S.v][i])}</strong> ${U[S.d]}</span>`).join('');
  document.querySelectorAll('.chip').forEach(b=>{const k=b.dataset.v;b.setAttribute('aria-pressed',k===S.v);b.querySelector('b').textContent=fmt(D.kota[S.a][k][i])});
}
function note(){const a=D.kota[S.a];$('#note').textContent=`Titik grid ${S.a}: ${fmt(a.grid_lat)}°, ${fmt(a.grid_lon)}°. Nilai pada chip adalah ${S.a} di tanggal yang dipilih. Sumber ${D.sumber}; nilai setelah ${dfmt(OBS,{day:'numeric',month:'long',year:'numeric'})} adalah prakiraan. Anomali OLR negatif berarti awan konvektif lebih aktif dari biasanya.`+(S.d==='pwat'?` Data PWAT: pengamatan sampai ${dfmt(OBS,{day:'numeric',month:'long',year:'numeric'})}, sesudahnya prakiraan. Grid 2,5°, sehingga titik grid bisa berjarak sampai sekitar 1,2° dari kota.`:'')}
function all(){note();draw()}
$('#ka').onchange=e=>{S.a=e.target.value;all()};
$('#kb').onchange=e=>{S.b=e.target.value;all()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){S.v=b.dataset.v;draw()}};
document.querySelector('#rg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.r=+b.dataset.r;document.querySelectorAll('#rg button').forEach(x=>x.setAttribute('aria-pressed',x===b));S.i=OBS;draw()};
svg.onpointermove=e=>{const r=svg.getBoundingClientRect(),{ml,mr,W,i0,i1}=G;S.i=Math.round(i0+((e.clientX-r.left)/r.width*W-ml)/(W-ml-mr)*(i1-i0));cur()};
svg.onkeydown=e=>{const d={ArrowLeft:-1,ArrowRight:1}[e.key];if(d){S.i+=d*(e.shiftKey?7:1);cur();e.preventDefault()}};
$('#dsg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.d=b.dataset.d;useDS(S.d);document.querySelectorAll('#dsg button').forEach(x=>x.setAttribute('aria-pressed',x===b));if(!D.variabel.includes(S.v))S.v=D.variabel[0];S.i=OBS;chips();all()};
addEventListener('resize',draw);
all();
}
const FILES=['data/gelombang/olr.waves.cfs.kota.json','data/gelombang/pwat-baru.kota.json'];
Promise.all(FILES.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.json()})))
.then(([o,p])=>init({olr:o,pwat:p}))
.catch(()=>{document.querySelector('main').innerHTML='<h1>Gelombang atmosfer di 45 kota</h1><p class="sub">Data grafik belum bisa dimuat. Buka halaman ini lewat Live Server atau hosting (bukan dengan klik dua kali pada file), dan pastikan file data/gelombang/olr.waves.cfs.kota.json dan pwat.waves.cfs.kota.json ada.</p>'});
</script></body></html>
